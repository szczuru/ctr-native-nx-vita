name: Build – PlayStation Vita (VPK)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (leave empty for CI-only build)'
        required: false
        default: ''

jobs:
  build-vita:
    name: Build VPK (vitasdk Docker)
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # VitaGL: make install, NIE cmake
      - name: Install VitaGL
        run: |
          git clone --depth 1 https://github.com/Rinnegatamante/vitaGL.git /tmp/vitaGL
          cd /tmp/vitaGL
          make install USE_SHARK=1 HAVE_UNFLIPPED_FBOS=1 -j$(nproc)

      - name: Set version
        id: ver
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      # CMakeLists_vita.cmake → vita/CMakeLists.txt
      # cmake wymaga dokładnie pliku CMakeLists.txt gdy używamy -S <dir>
      - name: Prepare vita/CMakeLists.txt
        run: cp vita/CMakeLists_vita.cmake vita/CMakeLists.txt

      - name: Configure (CMake)
        run: |
          cmake -B build-vita \
            -S vita \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCTR_NATIVE_VERSION="${{ steps.ver.outputs.version }}" \
            -DCTR_SOURCE_DIR="${PWD}"

      - name: Build VPK
        run: cmake --build build-vita --parallel $(nproc) --target vpk

      - name: Verify VPK
        run: ls -lh build-vita/ctr_native.vpk

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctr_native-vita-${{ steps.ver.outputs.version }}
          path: build-vita/ctr_native.vpk
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "CTR Native ${{ github.event.inputs.release_tag }} – PlayStation Vita"
          body: |
            ## CTR Native – PlayStation Vita

            ### Instalacja
            1. Prześlij `ctr_native.vpk` na Vitę przez VitaShell lub FTP.
            2. Zainstaluj VPK.
            3. Obraz dysku (NTSC-U): `ux0:/data/ctr_native/assets/ctr-u.bin`

            **Build ID:** `${{ github.sha }}`
          files: build-vita/ctr_native.vpk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
