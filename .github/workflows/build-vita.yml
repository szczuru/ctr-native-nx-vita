name: Build – PlayStation Vita (VPK)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'platform/**'
      - 'game/**'
      - 'include/**'
      - 'vita/**'
      - 'main.c'
      - 'CMakeLists.txt'
      - '.github/workflows/build-vita.yml'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (leave empty for CI-only build)'
        required: false
        default: ''

jobs:
  build-vita:
    name: Build VPK (vitasdk Docker)
    runs-on: ubuntu-latest
    # Oficjalny obraz vitasdk – $VITASDK i PATH już ustawione wewnątrz.
    # Obraz: vitasdk/vitasdk:latest (multi-arch: amd64 + arm64, ~1.6 GB).
    # Jeśli rozmiar jest problemem: vitasdk/vitasdk:latest-minimal (~764 MB).
    container:
      image: vitasdk/vitasdk:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # VitaGL buduje się przez `make install`, NIE przez cmake.
      # Repozytorium: https://github.com/Rinnegatamante/vitaGL
      # Wymagania: vitasdk (dostarczone przez obraz), make, git (dostarczone przez obraz).
      - name: Install VitaGL
        run: |
          git clone --depth 1 https://github.com/Rinnegatamante/vitaGL.git /tmp/vitaGL
          cd /tmp/vitaGL
          # USE_SHARK=1 – włącza vitashark (wymagany dla GLSL shaderów w VitaGL)
          # HAVE_UNFLIPPED_FBOS=1 – poprawia orientację FBO (ważne dla naszego blitu)
          make install \
            USE_SHARK=1 \
            HAVE_UNFLIPPED_FBOS=1 \
            -j$(nproc)

      - name: Set version
        id: ver
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure (CMake)
        run: |
          cmake -B build-vita \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DPLATFORM=vita \
            -DCMAKE_BUILD_TYPE=Release \
            -DCTR_NATIVE_VERSION="${{ steps.ver.outputs.version }}"

      - name: Build ELF + VPK
        run: cmake --build build-vita --parallel $(nproc) --target vpk

      - name: Verify VPK
        run: |
          ls -lh build-vita/ctr_native.vpk
          file build-vita/ctr_native.vpk

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctr_native-vita-${{ steps.ver.outputs.version }}
          path: build-vita/ctr_native.vpk
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "CTR Native ${{ github.event.inputs.release_tag }} – PlayStation Vita"
          body: |
            ## CTR Native – PlayStation Vita

            ### Instalacja
            1. Prześlij `ctr_native.vpk` na Vitę przez VitaShell lub FTP.
            2. Zainstaluj VPK z VitaShell.
            3. Umieść obraz dysku gry (NTSC-U):
               ```
               ux0:/data/ctr_native/assets/ctr-u.bin
               ```

            ### Konfiguracja (`ux0:/data/ctr_native/config.ini`, tworzony przy pierwszym uruchomieniu)
            | Klucz | Wartości | Opis |
            |---|---|---|
            | `widescreen` | 0 / 1 | 0 = 4:3 pillarbox (domyślnie), 1 = 16:9 stretch |
            | `target_fps` | 30 / 60 | Docelowa liczba klatek |
            | `bilinear`   | 0 / 1 | 0 = nearest (PSX-authentic), 1 = bilinear |

            **Build ID:** `${{ github.sha }}`
          files: build-vita/ctr_native.vpk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
