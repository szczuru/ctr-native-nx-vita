name: Build – Nintendo Switch (NRO)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'platform/**'
      - 'game/**'
      - 'include/**'
      - 'switch/**'
      - 'main.c'
      - 'CMakeLists.txt'
      - '.github/workflows/build-switch.yml'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (leave empty for CI-only build)'
        required: false
        default: ''

jobs:
  build-switch:
    name: Build NRO (devkitPro Docker)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update Switch packages
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm --needed devkitA64 libnx switch-tools

      - name: Set version
        id: ver
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      # CMakeLists_switch.cmake → switch/CMakeLists.txt
      # cmake wymaga dokładnie pliku CMakeLists.txt gdy używamy -S <dir>
      - name: Prepare switch/CMakeLists.txt
        run: cp switch/CMakeLists_switch.cmake switch/CMakeLists.txt

      - name: Configure (CMake)
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITA64: /opt/devkitpro/devkitA64
        run: |
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          cmake -B build-switch \
            -S switch \
            -DCMAKE_TOOLCHAIN_FILE="${PWD}/switch/switch-toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCTR_NATIVE_VERSION="${{ steps.ver.outputs.version }}" \
            -DCTR_SOURCE_DIR="${PWD}"

      - name: Build ELF + NRO
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITA64: /opt/devkitpro/devkitA64
        run: |
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          cmake --build build-switch --parallel $(nproc) --target nro

      - name: Verify NRO
        run: ls -lh build-switch/ctr_native.nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctr_native-switch-${{ steps.ver.outputs.version }}
          path: build-switch/ctr_native.nro
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "CTR Native ${{ github.event.inputs.release_tag }} – Nintendo Switch"
          body: |
            ## CTR Native – Nintendo Switch

            ### Instalacja
            1. Skopiuj `ctr_native.nro` na SD: `/switch/ctr_native/ctr_native.nro`
            2. Obraz dysku (NTSC-U): `/ctr_native/assets/ctr-u.bin`
            3. Uruchom z Homebrew Menu.

            ### Multiplayer
            Podłącz do 4 kontrolerów – gra wykrywa je automatycznie.

            **Build ID:** `${{ github.sha }}`
          files: build-switch/ctr_native.nro
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
