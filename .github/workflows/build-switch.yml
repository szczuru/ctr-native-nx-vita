name: Build – Nintendo Switch (NRO)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'platform/**'
      - 'game/**'
      - 'include/**'
      - 'switch/**'
      - 'main.c'
      - 'CMakeLists.txt'
      - '.github/workflows/build-switch.yml'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (leave empty for CI-only build)'
        required: false
        default: ''

jobs:
  build-switch:
    name: Build NRO (devkitPro Docker)
    runs-on: ubuntu-latest
    # Oficjalny obraz devkitPro z pre-installed devkitA64, libnx, switch-tools.
    # Nie używamy dkp-pacman w CI (zalecenie devkitPro).
    container:
      image: devkitpro/devkita64:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Obraz devkitpro/devkita64 zawiera już devkitA64, libnx, switch-tools.
      # SDL3 jest vendorowany przez ctr-native w externals/SDL/ – nie potrzebujemy
      # switch-sdl3 z pacmana (który i tak nie istnieje).
      # Instalujemy tylko ewentualne brakujące zależności budowania.
      - name: Update devkitPro packages
        run: |
          dkp-pacman -Syu --noconfirm
          # switch-tools zawiera elf2nro i nacptool – upewniamy się że są aktualne
          dkp-pacman -S --noconfirm --needed \
            devkitA64 \
            libnx \
            switch-tools

      - name: Set version
        id: ver
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure (CMake)
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITA64: /opt/devkitpro/devkitA64
        run: |
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          cmake -B build-switch \
            -DCMAKE_TOOLCHAIN_FILE=switch/switch-toolchain.cmake \
            -DPLATFORM=switch \
            -DCMAKE_BUILD_TYPE=Release \
            -DCTR_NATIVE_VERSION="${{ steps.ver.outputs.version }}"

      - name: Build ELF + NRO
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITA64: /opt/devkitpro/devkitA64
        run: |
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          cmake --build build-switch --parallel $(nproc) --target nro

      - name: Verify NRO
        run: |
          ls -lh build-switch/ctr_native.nro
          file build-switch/ctr_native.nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctr_native-switch-${{ steps.ver.outputs.version }}
          path: build-switch/ctr_native.nro
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "CTR Native ${{ github.event.inputs.release_tag }} – Nintendo Switch"
          body: |
            ## CTR Native – Nintendo Switch

            ### Instalacja
            1. Skopiuj `ctr_native.nro` na kartę SD: `/switch/ctr_native/ctr_native.nro`
            2. Umieść obraz dysku gry (NTSC-U) na SD:
               ```
               /ctr_native/assets/ctr-u.bin
               ```
            3. Uruchom z Homebrew Menu.

            ### Konfiguracja (`/ctr_native/config.ini` na SD, tworzony przy pierwszym uruchomieniu)
            | Klucz | Wartości | Opis |
            |---|---|---|
            | `widescreen` | 0 / 1 | 0 = 4:3 pillarbox, 1 = 16:9 stretch |
            | `target_fps` | 30 / 60 | Docelowa liczba klatek |
            | `bilinear`   | 0 / 1 | 0 = nearest (PSX-authentic), 1 = bilinear |
            | `integer_scale` | 0 / 1 | Skalowanie całkowitą liczbą pikseli |

            ### Multiplayer
            Podłącz do 4 kontrolerów – gra wykrywa je automatycznie, tak jak oryginalna PS1 z multitapem.

            **Build ID:** `${{ github.sha }}`
          files: build-switch/ctr_native.nro
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
