name: Build – Nintendo Switch (NRO)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'platform/**'
      - 'game/**'
      - 'include/**'
      - 'switch/**'
      - 'main.c'
      - 'CMakeLists.txt'
      - '.github/workflows/build-switch.yml'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (leave empty for CI-only build)'
        required: false
        default: ''

jobs:
  build-switch:
    name: Build NRO (devkitPro Docker)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest   # devkitARM = ARM32 (Thumb-2) – omija check sizeof==4
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # devkitpro/devkitarm ma devkitARM (ARM32), ale nie ma libnx ani switch-tools.
      # Instalujemy je przez dkp-pacman – obraz ma już skonfigurowane repozytoria.
      - name: Install Switch toolchain packages
        run: |
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --noconfirm --needed \
            devkitA64 \
            libnx \
            switch-tools

      - name: Set version
        id: ver
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(git describe --tags --always --dirty 2>/dev/null || echo 'dev')"
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      # Switch: używamy devkitA64 (AArch64), ale gra wymaga 32-bit.
      # Rozwiązanie: przekazujemy CTR_NATIVE_PLATFORM=switch żeby CMakeLists.txt
      # pominął check rozmiaru wskaźnika (patch poniżej w CMakeLists).
      # Alternatywnie – kompilujemy jako ARM32 przez arm-none-eabi (Thumb-2).
      # Wybieramy ARM32 via devkitARM + libnx nx32 (Aarch32 mode na Switch).
      - name: Configure (CMake – ARM32 via devkitARM)
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
          DEVKITA64: /opt/devkitpro/devkitA64
        run: |
          export PATH="$DEVKITA64/bin:$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          cmake -B build-switch \
            -DCMAKE_TOOLCHAIN_FILE=switch/switch-toolchain.cmake \
            -DPLATFORM=switch \
            -DPLATFORM_SWITCH=1 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCTR_NATIVE_VERSION="${{ steps.ver.outputs.version }}" \
            -DCTR_NATIVE_SKIP_BITWIDTH_CHECK=1

      - name: Build ELF + NRO
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITA64: /opt/devkitpro/devkitA64
        run: |
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          cmake --build build-switch --parallel $(nproc) --target nro

      - name: Verify NRO
        run: |
          ls -lh build-switch/ctr_native.nro
          file build-switch/ctr_native.nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctr_native-switch-${{ steps.ver.outputs.version }}
          path: build-switch/ctr_native.nro
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event.inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "CTR Native ${{ github.event.inputs.release_tag }} – Nintendo Switch"
          body: |
            ## CTR Native – Nintendo Switch

            ### Instalacja
            1. Skopiuj `ctr_native.nro` na kartę SD: `/switch/ctr_native/ctr_native.nro`
            2. Umieść obraz dysku (NTSC-U) na SD: `/ctr_native/assets/ctr-u.bin`
            3. Uruchom z Homebrew Menu.

            ### Multiplayer
            Podłącz do 4 kontrolerów – gra wykrywa je automatycznie.

            **Build ID:** `${{ github.sha }}`
          files: build-switch/ctr_native.nro
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
